<!DOCTYPE html>
<html>
<head>
<title>GROWVIBE - Explore</title>
<style>
body{background:black;color:white;text-align:center;font-family:Arial;padding:20px}
h1{color:#a3e635;font-size:40px}
p{color:#ccc}
button{background:#a3e635;color:black;border:none;padding:10px 20px;width:auto;margin:10px;font-size:16px;font-weight:bold;border-radius:10px}
.white{background:white}
.card{background:#111;border:1px solid #a3e635;border-radius:10px;padding:12px;margin:10px auto;width:90%;text-align:left;color:white;font-size:14px;max-height:80px;overflow:hidden}
.card.open{max-height:none}
.small{font-size:12px;color:#a3e635}
</style>
</head>
<body>
<h1>GROWVIBE</h1>
<p>Don't just post. Grow.</p>
<p>Explore - All Posts</p>
<button onclick="loadPosts()">Refresh Posts</button><br>
<button class="white" onclick="goHome()">Back to Home</button>
<div id="posts"></div>
<p style="font-size:12px;color:#888">v1.0 - Small creators get seen first.</p>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://jmindaqnutuooogunctk.supabase.co";
const SUPABASE_KEY = "sb_publishable_uMbzDNypMhww4KtuBbbjGg_OzOgkI7W";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
async function loadPosts(){
document.getElementById("posts").innerHTML = "Loading...";
let { data, error } = await supabaseClient.from("posts").select("*").order("created_at", {ascending:false});
if(error){ document.getElementById("posts").innerHTML = "Error: " + error.message; return; }
if(!data || data.length===0){ document.getElementById("posts").innerHTML = "No posts yet. Be the first!"; return; }
let html = "";
data.forEach(function(post, i){
let t = post.text || "";
  let mediaHtml = "";
if(post.media_url){ if(post.media_url.includes(".mp4") || post.media_url.includes("video")){ mediaHtml = '<br><video src="'+post.media_url+'" controls style="width:100%;border-radius:10px"></video>'; } else { mediaHtml = '<br><img src="'+post.media_url+'" style="width:100%;border-radius:10px">'; } }
html += '<div class="card" id="c'+i+'">' + t.replace(/</g,"&lt;") + '<br><br><span class="small" onclick="document.getElementById(\'c'+i+'\').classList.toggle(\'open\')">Show more / Show less</span><br><br><input id="cm'+i+'" placeholder="Write a comment..." style="width:70%;padding:8px;border-radius:8px;border:none"><button onclick="addComment(\''+post.id+'\',\'cm'+i+'\')" style="padding:8px 10px">Comment</button><div id="comments'+i+'" style="font-size:13px;margin-top:8px"></div></div>';
});
document.getElementById("posts").innerHTML = html;
}
async function addComment(postId, inputId){
let txt = document.getElementById(inputId).value;
if(!txt){ return; }
let { error } = await supabaseClient.from("comments").insert([{ post_id: postId, text: txt }]);
if(error){ alert("Error: " + error.message); return; }
document.getElementById(inputId).value = "";
alert("Comment posted!");
}
function goHome(){ window.location.href = "home.html"; }
loadPosts();
</script>
</body>
</html>
