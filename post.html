<!DOCTYPE html>
<html>
<head>
<title>GROWVIBE - Create Post</title>
<style>
body{background:black;color:white;text-align:center;font-family:Arial;padding:20px}
h1{color:#a3e635;font-size:40px}
p{color:#ccc}
textarea{width:90%;height:120px;padding:12px;font-size:16px;border-radius:10px;border:2px solid #a3e635;background:#111;color:white}
button{background:#a3e635;color:black;border:none;padding:10px 20px;width: auto;margin:10px;font-size:18px;font-weight:bold;border-radius:10px}
.white{background:white}
</style>
</head>
<body>
<h1>GROWVIBE</h1>
<p>Don't just post. Grow.</p>
<p>Create Post</p>
<textarea id="postText" placeholder="Write your post here... Share your idea, your business, your story."></textarea><br>
<button onclick="savePost()">Post Now</button><br>
<button onclick="goHome()">Back to Home</button>
<p id="msg"></p>
<p style="font-size:12px;color:#888">v1.0 - Small creators get seen first.</p>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://jmindaqnutuooogunctk.supabase.co";
const SUPABASE_KEY = "sb_publishable_uMbzDNypMhww4KtuBbbjGg_OzOgkI7W";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
async function savePost(){
let text = document.getElementById("postText").value;
if(!text){ document.getElementById("msg").innerText = "Write something first."; return; }
document.getElementById("msg").innerText = "Posting...";
let { error } = await supabaseClient.from("posts"). insert([{ text: text }]);
if(error){ document.getElementById("msg").innerText = "Error: " + error.message; }
else{ document.getElementById("msg").innerText = "Posted! Welcome to GROWVIBE."; document.getElementById("postText").value = ""; }
}
function goHome(){ window.location.href = "home.html"; }
</script>
</body>
</html>
