<!DOCTYPE html>
<html>
<head>
<title>GROWVIBE - Login</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{background:#000;color:#fff;font-family:Arial;text-align:center;padding:40px}
h1{color:#b6ff00;font-size:40px}
input{display:block;width:90%;max-width:300px;margin:10px auto;padding:12px;border-radius:10px;border:1px solid #b6ff00;background:#111;color:#fff}
button{background:#b6ff00;color:#000;padding:12px 30px;border:none;border-radius:10px;font-weight:bold;margin:5px}
a{color:#b6ff00}
</style>
</head>
<body>
<h1>GROWVIBE</h1>
<p>Don't just post. Grow.</p>
<h2>Login / Sign Up</h2>
<input id="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<br>
<button onclick="signup()">Sign Up</button>
<button onclick="login()">Login</button>
<p id="msg"></p>
<p><a href="../frontend">Back to Home</a></p>
<script>
const SUPABASE_URL = "https://jmindaqnutuooogunctk.supabase.co";
const SUPABASE_KEY = "sb_publishable_uMbzDNypMhww4KtuBbbjGg_OzOgkI7W";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
async function signup(){
  const email=document.getElementById('email').value;
  const password=document.getElementById('password').value;
  const {error}=await sb.auth.signUp({email,password});
  document.getElementById('msg').innerText=error?error.message:'Sign Up Success! Now tap Login.';
}
async function login(){
  const email=document.getElementById('email').value;
  const password=document.getElementById('password').value;
  const {error}=await sb.auth.signInWithPassword({email,password});
  document.getElementById('msg').innerText=error?error.message:'Login Success! Welcome to GROWVIBE.';
  if(!error){ setTimeout(function(){ window.location.href="../home.html"; },1000); }
}
</script>
</body>
</html>
